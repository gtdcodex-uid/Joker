<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="jokepro.css">
</head>

    <body class="dark-mode">
    <div class="card">
        <div id="emoji"></div>
        <div class="joke">Click start to hear a joke!</div>
        
        <div id="btn-cont">
            <button id="btn">Start Jokes!</button>
            <button id="stop-btn" class="hidden">Stop</button>
        </div>
    </div>



















    <script>
        const jokeEl = document.querySelector('.joke');
const emojiEl = document.getElementById('emoji');
const startBtn = document.getElementById('btn');
const stopBtn = document.getElementById('stop-btn');

let jokeInterval = null;

async function fetchJoke() {
    try {
        // Add a slight fade out for the old joke
        jokeEl.style.opacity = 0;

        const response = await fetch("https://official-joke-api.appspot.com/random_joke");
        const data = await response.json();

        // Wait for fade out to finish, then change text
        setTimeout(() => {
            jokeEl.innerText = `${data.setup} ... ${data.punchline}`;
            jokeEl.style.opacity = 1;
            jokeEl.classList.add('fade-in');
            
            // Trigger Emoji Animation
            emojiEl.innerText = '😂';
            emojiEl.classList.remove('animate-pop');
            void emojiEl.offsetWidth; // Trigger reflow to restart animation
            emojiEl.classList.add('animate-pop');

            // Remove fade-in class so it can be re-added later
            setTimeout(() => jokeEl.classList.remove('fade-in'), 500);
        }, 300);

    } catch (error) {
        jokeEl.innerText = "Oops! Failed to fetch joke.";
        console.error(error);
    }
}

startBtn.addEventListener('click', () => {
    // UI Changes
    startBtn.disabled = true;
    startBtn.innerText = "Running...";
    stopBtn.classList.remove('hidden');

    // Start logic
    fetchJoke(); // Get first joke immediately
    jokeInterval = setInterval(fetchJoke, 4000);
});

stopBtn.addEventListener('click', () => {
    // Stop logic
    clearInterval(jokeInterval);
    startBtn.disabled = false;
    startBtn.innerText = "Start Jokes!";
    stopBtn.classList.add('hidden');
    jokeEl.innerText = "Stopped. Click start to resume.";
});
    </script>
</body>
    
</html>
